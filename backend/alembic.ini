# Configurazione Alembic per T-Hub.
# Eseguire dentro il container backend (working dir /app):
#   alembic revision --autogenerate -m "descrizione"   # nuova migrazione dai modelli
#   alembic upgrade head                                # applica le migrazioni
# La URL del database viene letta da app.config.settings in migrations/env.py.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
